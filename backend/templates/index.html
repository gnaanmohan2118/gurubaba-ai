<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gurubaba AI</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f3efe7; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 16px; }
    .reply { margin-top: 20px; background: #fff8dc; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🧘 Gurubaba AI</h1>
  <form id="chat-form">
    <textarea id="message" placeholder="Ask your question..."></textarea><br>
    <button type="submit">Ask Baba</button>
  </form>
  <div class="reply" id="responseBox"></div>

  <script>
    document.getElementById("chat-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const message = document.getElementById("message").value;

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      const data = await res.json();
      document.getElementById("responseBox").innerText = data.reply || data.error;
    });
  </script>
</body>
</html>
